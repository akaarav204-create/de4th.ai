services:
  - type: web
    name: frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: redirect
        source: /
        destination: /index.html
  - type: web
    name: backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ASSISTANT_NAME
        value: Jarvis
      - key: APP_VERSION
        value: 1.1.0
